name: deploy-dispatcher

# Push-to-main deploy. Builds the Dispatcher API container, pushes it to the
# pre-provisioned ACR, and rolls the pre-provisioned Container App to the new
# image. No infra creation — the lab has already stood up ACR, Container Apps
# environment, and a placeholder container app; this workflow only updates
# the image.

on:
  push:
    branches: [main]
    paths:
      - "ai300_lesson9_dispatcher_foundry/src/**"
      - "ai300_lesson9_dispatcher_foundry/prompts/**"
      - "ai300_lesson9_dispatcher_foundry/requirements.txt"
      - "ai300_lesson9_dispatcher_foundry/Dockerfile"
      - "ai300_lesson9_dispatcher_foundry/.github/workflows/deploy-dispatcher.yml"

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: dispatcher-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai300_lesson9_dispatcher_foundry
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: ACR login
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Build and push image
        run: |
          FQ="${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"
          docker build -t "$FQ" .
          docker push "$FQ"
          echo "IMAGE_FQ=$FQ" >> "$GITHUB_ENV"

      - name: Update Container App
        run: |
          az containerapp update \
            --name        "${{ secrets.ACA_APP_NAME }}" \
            --resource-group "${{ secrets.ACA_RESOURCE_GROUP }}" \
            --image       "$IMAGE_FQ" \
            --set-env-vars \
              AZURE_FOUNDRY_ENDPOINT="${{ secrets.AZURE_FOUNDRY_ENDPOINT }}" \
              AZURE_FOUNDRY_PROJECT=dispatcher \
              CHAT_DEPLOYMENT=gpt-5.1 \
              EMBEDDING_DEPLOYMENT=text-embedding-3-large \
              APPLICATIONINSIGHTS_CONNECTION_STRING="${{ secrets.APPINSIGHTS_CS }}" \
              OTEL_SERVICE_NAME=dispatcher-api

      - name: Show revision + FQDN
        run: |
          az containerapp show \
            --name        "${{ secrets.ACA_APP_NAME }}" \
            --resource-group "${{ secrets.ACA_RESOURCE_GROUP }}" \
            --query "{fqdn: properties.configuration.ingress.fqdn, revision: properties.latestRevisionName}" \
            -o table
