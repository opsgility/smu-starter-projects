# AZ-DEV-100 Module 3 — GitHub Actions OIDC deploy for the Anchorline storefront.
#
# Set these repo Variables (Settings → Secrets and variables → Actions → Variables tab):
#   AZURE_CLIENT_ID       — clientId of the pre-provisioned user-assigned MI (Environment tab)
#   AZURE_TENANT_ID       — Entra tenant ID (Environment tab)
#   AZURE_SUBSCRIPTION_ID — subscription ID (Environment tab)
#   AZURE_RG              — resource group name (Environment tab)
#   AZURE_WEBAPP          — Web App name (Environment tab)
#
# Do NOT add any Secrets. OIDC = zero stored credentials.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or SHA). Defaults to main.'
        required: false
        default: 'main'

permissions:
  id-token: write   # Required for azure/login@v2 to request an OIDC token from GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Package as zip
        run: cd publish && zip -r ../app.zip . && cd ..

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        run: |
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RG }}" \
            --name "${{ vars.AZURE_WEBAPP }}" \
            --src-path ./app.zip \
            --type zip

      - name: Smoke test
        run: |
          HOST=$(az webapp show --resource-group "${{ vars.AZURE_RG }}" --name "${{ vars.AZURE_WEBAPP }}" --query 'defaultHostName' -o tsv)
          for i in {1..12}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$HOST/health")
            if [ "$code" = "200" ]; then echo "OK on attempt $i"; exit 0; fi
            sleep 5
          done
          echo "health check failed"; exit 1
