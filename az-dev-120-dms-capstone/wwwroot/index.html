<!doctype html>
<meta charset="utf-8">
<title>Anchorline DMS</title>
<style>body{font-family:system-ui;max-width:720px;margin:2rem auto;padding:0 1rem}fieldset{margin-bottom:1rem;padding:1rem}input,button,select{padding:.5rem;font-size:1rem;margin:.25rem}pre{background:#f0f0f0;padding:1rem;overflow:auto}</style>
<h1>Anchorline Document Management System</h1>

<fieldset>
<legend>Upload</legend>
<label>Tenant: <input id="up-tenant" value="acme"></label>
<label>File: <input type="file" id="up-file"></label>
<label>Type: <select id="up-type"><option>invoice<option>report<option>contract</select></label>
<label>Year: <input id="up-year" value="2026"></label>
<button id="up-go">Upload</button>
</fieldset>

<fieldset>
<legend>Search</legend>
<label>Tenant: <input id="s-tenant" value="acme"></label>
<label>Type: <input id="s-type" value="invoice"></label>
<label>Year: <input id="s-year" value="2026"></label>
<button id="s-go">Search</button>
</fieldset>

<pre id="log"></pre>
<script>
const log = document.getElementById('log');
function say(s){ log.textContent += s + "\n" }
document.getElementById('up-go').onclick = async () => {
    const t = document.getElementById('up-tenant').value;
    const f = document.getElementById('up-file').files[0];
    if (!f) return say('pick a file');
    say(`prepare SAS for ${t}/${f.name}...`);
    const prep = await (await fetch(`/api/upload/prepare?tenantId=${t}&name=${encodeURIComponent(f.name)}`, {method:'POST'})).json();
    say(`SAS ok; PUT to blob...`);
    const put = await fetch(prep.uploadUrl, { method:'PUT', headers:{'x-ms-blob-type':'BlockBlob'}, body: f });
    say(`upload: ${put.status}`);
    say(`register doc metadata + tags...`);
    const reg = await (await fetch('/api/docs', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({
        tenantId: t, name: f.name, author: 'labuser', department: 'ops',
        documentType: document.getElementById('up-type').value, year: document.getElementById('up-year').value
    }) })).json();
    say(JSON.stringify(reg, null, 2));
};
document.getElementById('s-go').onclick = async () => {
    const t = document.getElementById('s-tenant').value;
    const tp = document.getElementById('s-type').value;
    const y = document.getElementById('s-year').value;
    say(`search tenant=${t} type=${tp} year=${y}...`);
    const r = await (await fetch(`/api/docs?tenantId=${t}&documentType=${tp}&year=${y}`)).json();
    say(JSON.stringify(r, null, 2));
};
</script>
