componentType: state.azure.cosmosdb
version: v1
metadata:
- name: url
  value: "<COSMOS ENDPOINT>"
- name: database
  value: AnchorlineDapr
- name: collection
  value: state
# Managed-Identity auth — no master key stored anywhere.
# The ACA app's system-assigned MI (or a user-assigned MI attached
# to the container app) must be granted the built-in Cosmos DB Data
# Contributor role at the account or database scope.
- name: azureClientId
  value: "<managed-identity-client-id>"
scopes:
- order-processor
