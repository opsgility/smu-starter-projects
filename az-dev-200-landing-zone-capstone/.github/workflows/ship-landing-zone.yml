name: Ship Anchorline Landing Zone (dev → test → prod)

on:
  push:
    branches: [ main ]
    paths: [ 'envs/**', 'modules/**' ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bicep lint
        run: for f in envs/*/main.bicep; do az bicep lint --file "$f"; done
      - uses: microsoft/[email protected]
        with:
          modules: 'PSRule.Rules.Azure'
          baseline: 'Azure.Default'
          inputPath: 'envs/'

  deploy-dev:
    needs: test-bicep
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment group what-if \
            -g "${{ vars.RESOURCE_GROUP_DEV }}" \
            -f envs/dev/main.bicep \
            -p sqlAdminObjectId=${{ secrets.SQL_ADMIN_OBJECT_ID }}
      - name: Deploy dev stack
        run: |
          az stack group create \
            --name anchorline-dev \
            --resource-group "${{ vars.RESOURCE_GROUP_DEV }}" \
            --template-file envs/dev/main.bicep \
            --parameters sqlAdminObjectId=${{ secrets.SQL_ADMIN_OBJECT_ID }} \
            --action-on-unmanage deleteAll \
            --deny-settings-mode denyDelete \
            --yes

  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy test stack
        run: |
          az stack group create \
            --name anchorline-test \
            --resource-group "${{ vars.RESOURCE_GROUP_TEST }}" \
            --template-file envs/prod/main.bicep \
            --parameters envs/prod/prod.bicepparam \
            --action-on-unmanage deleteAll \
            --deny-settings-mode denyDelete \
            --yes

  deploy-prod:
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if prod
        run: |
          az deployment group what-if \
            -g "${{ vars.RESOURCE_GROUP_PROD }}" \
            -f envs/prod/main.bicep \
            -p envs/prod/prod.bicepparam \
            --result-format ResourceIdOnly
      - name: Deploy prod stack (multi-region)
        run: |
          az stack group create \
            --name anchorline-prod \
            --resource-group "${{ vars.RESOURCE_GROUP_PROD }}" \
            --template-file envs/prod/main.bicep \
            --parameters envs/prod/prod.bicepparam \
            --action-on-unmanage deleteAll \
            --deny-settings-mode denyDelete \
            --yes
