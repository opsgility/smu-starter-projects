name: Promote through Dev → Test → Prod

on:
  push:
    branches: [ main ]
    paths: [ 'envs/**' ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev            # no protection rules — auto-promoted
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP_DEV }}
          template: envs/dev/main.bicep
          deploymentName: dev-${{ github.run_id }}

  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: test           # environment protection — requires reviewer approval
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP_TEST }}
          template: envs/test/main.bicep
          deploymentName: test-${{ github.run_id }}

  deploy-prod:
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: prod           # environment protection — 2 reviewers, no self-approve
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if before prod deploy
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.RESOURCE_GROUP_PROD }}" \
            --template-file envs/prod/main.bicep \
            --result-format ResourceIdOnly
      - uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP_PROD }}
          template: envs/prod/main.bicep
          deploymentName: prod-${{ github.run_id }}
