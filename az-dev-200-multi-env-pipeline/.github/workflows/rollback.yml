name: Rollback prod to a previous tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag of the known-good release to redeploy (e.g. v1.4.2)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ inputs.tag }} }
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Redeploy prod at tag ${{ inputs.tag }}
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP_PROD }}
          template: envs/prod/main.bicep
          deploymentName: rollback-${{ inputs.tag }}-${{ github.run_id }}
