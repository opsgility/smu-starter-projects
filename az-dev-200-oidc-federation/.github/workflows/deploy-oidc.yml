name: Deploy via OIDC (zero secrets)

on:
  push:
    branches: [ main ]
    paths: [ 'main.bicep' ]
  workflow_dispatch:

permissions:
  id-token: write   # REQUIRED for OIDC token exchange with Entra
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (federated OIDC — no client secret)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify no client secret leaked
        run: |
          if [ -n "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "AZURE_CLIENT_SECRET is set — federation is not being used. Fail." >&2
            exit 1
          fi
          echo "Confirmed: no AZURE_CLIENT_SECRET in env — auth is via OIDC federation only."

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP }}
          template: main.bicep
          deploymentName: anchorline-oidc-${{ github.run_id }}

      - name: Show outputs
        run: |
          az deployment group show \
            -g "${{ vars.RESOURCE_GROUP }}" \
            -n "anchorline-oidc-${{ github.run_id }}" \
            --query properties.outputs
