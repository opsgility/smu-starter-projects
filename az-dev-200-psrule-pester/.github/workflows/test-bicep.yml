name: Bicep test gates (lint + PSRule + Pester)

on:
  pull_request:
    branches: [ main ]
    paths: [ 'main.bicep', 'tests/**', 'ps-rule.yaml' ]

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bicep lint
        run: az bicep lint --file main.bicep

  psrule:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/[email protected]
        with:
          modules: 'PSRule.Rules.Azure'
          baseline: 'Azure.Default'
          inputPath: 'main.bicep'
          outputFormat: 'Sarif'
          outputPath: 'psrule.sarif'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: 'psrule.sarif' }

  pester:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.TestResult.Enabled = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
