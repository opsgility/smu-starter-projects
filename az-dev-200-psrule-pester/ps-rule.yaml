# PSRule for Azure config
requires:
  PSRule: '>=2.9.0'
  PSRule.Rules.Azure: '>=1.36.0'

input:
  format: File
  pathIgnore:
    - '**/*.md'
    - '**/*.png'
    - '.github/**'

output:
  culture:
    - en-US

execution:
  aliasReferenceWarning: false
  unprocessedObject: Ignore

rule:
  baseline: Azure.Default

configuration:
  AZURE_BICEP_FILE_EXPANSION: true
  AZURE_BICEP_FILE_EXPANSION_TIMEOUT: 30
  AZURE_BICEP_MINIMUM_VERSION: '0.28.0'

binding:
  targetName:
    - Name
    - name
