name: TaskForge deploy
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet test --logger 'trx;LogFileName=test.trx'

  deploy-dev:
    needs: build-test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az stack sub create --name tf-workload-dev \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters env=dev \
            --action-on-unmanage deleteResources \
            --deny-settings-mode none

  integration-dev:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet test tests/TaskForge.IntegrationTests/ --logger 'trx'

  what-if-test:
    needs: integration-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az deployment sub what-if --location eastus2 --template-file infra/main.bicep --parameters env=test

  psrule-pester:
    needs: what-if-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module -Name PSRule.Rules.Azure -Scope CurrentUser -Force
          Install-Module -Name Pester -Scope CurrentUser -Force
          Invoke-PSRule -Module PSRule.Rules.Azure -InputPath infra/ -Outcome Fail -ErrorAction Stop
          Invoke-Pester -Path tests/PSTests/ -Output Detailed

  deploy-prod:
    needs: psrule-pester
    runs-on: ubuntu-latest
    environment: production   # requires manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az webapp deployment slot swap --slot staging --resource-group rg-taskforge-prod --name taskforge-web
