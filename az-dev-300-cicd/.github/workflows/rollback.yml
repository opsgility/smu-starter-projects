name: Rollback prod
on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'reverse-swap | flag-flip | redeploy-tag'
        required: true
        default: 'reverse-swap'
      tag:
        description: 'For redeploy-tag: git tag to redeploy'
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  reverse-swap:
    if: ${{ inputs.strategy == 'reverse-swap' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az webapp deployment slot swap \
            --name taskforge-web --resource-group rg-taskforge-prod \
            --slot staging --target-slot production
          sleep 30
          curl -f https://taskforge.anchorline.com/health/ready
