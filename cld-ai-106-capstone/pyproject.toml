[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-mcp-server"
version = "0.1.0"
description = "Orion Analytics MCP server: customer, runbook, and refund tools."
requires-python = ">=3.10"
dependencies = ["mcp", "pydantic"]

[project.scripts]
orion-mcp = "orion_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
