spring.application.name=ecommerce
server.port=8081

# H2 in-memory (H2 is already on the classpath). Swap to PostgreSQL locally by
# uncommenting the block below and starting a Postgres container.
spring.datasource.url=jdbc:h2:mem:ecommerce;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

